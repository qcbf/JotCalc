name: Release

run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-web-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z, received $RELEASE_TAG"
            exit 1
          fi
          if [[ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "The checked out commit is not exactly tagged $RELEASE_TAG"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD$ANDROID_STORE_PASSWORD" ]]; then
            echo "Using Android debug signing."
            exit 0
          fi
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" ||
                -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_STORE_PASSWORD" ]]; then
            echo "Configure all four Android signing secrets before publishing with a release key."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build Web release
        run: dart tool/build_web.dart

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/android-symbols

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p build/release-assets
          (cd build/web-release && zip -q -9 -r "../release-assets/jotcalc-${RELEASE_TAG}-web.zip" .)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "build/release-assets/jotcalc-${RELEASE_TAG}-${abi}.apk"
          done

      - name: Upload Web and Android packages
        uses: actions/upload-artifact@v4
        with:
          name: web-android
          path: build/release-assets/
          if-no-files-found: error
          compression-level: 0

  build-windows:
    runs-on: windows-2025
    outputs:
      archive: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        id: flutter
        if: hashFiles('windows/CMakeLists.txt') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build and package Windows x64
        id: package
        if: steps.flutter.outcome == 'success'
        shell: cmd
        run: call tool\build_windows_release.bat

      - name: Upload Windows package
        id: upload
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/jotcalc-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [build-web-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Web and Android packages
        uses: actions/download-artifact@v4
        with:
          name: web-android
          path: build/release-assets

      - name: Download Windows package
        if: needs.build-windows.outputs.archive != ''
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: build/windows-release

      - name: Name the Windows release asset
        if: needs.build-windows.outputs.archive != ''
        run: mv build/windows-release/jotcalc-windows-x64.zip "build/release-assets/jotcalc-${RELEASE_TAG}-windows-x64.zip"

      - name: Write release checksums
        working-directory: build/release-assets
        run: sha256sum *.apk *.zip > "jotcalc-${RELEASE_TAG}-SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: JotCalc ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/release-assets/*
